name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: [demo, project]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: ${{ matrix.folder }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pytest -q
